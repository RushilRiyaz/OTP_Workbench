name: CI

on:
  push:
    branches: [main, dev, feature/**]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome dependencies
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_OTP_API_URL: ${{ secrets.NEXT_PUBLIC_OTP_API_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          NEXT_PUBLIC_AUTOCOMPLETE_API_URL: ${{ secrets.NEXT_PUBLIC_AUTOCOMPLETE_API_URL }}
          NEXT_PUBLIC_PROD_OTP_URL: ${{ secrets.NEXT_PUBLIC_PROD_OTP_URL }}
          NEXT_PUBLIC_PROD_AUTOCOMPLETE_URL: ${{ secrets.NEXT_PUBLIC_PROD_AUTOCOMPLETE_URL }}
          NEXT_PUBLIC_PROD_API_KEY: ${{ secrets.NEXT_PUBLIC_PROD_API_KEY }}
          NEXT_PUBLIC_STAGE_OTP_URL: ${{ secrets.NEXT_PUBLIC_STAGE_OTP_URL }}
          NEXT_PUBLIC_STAGE_AUTOCOMPLETE_URL: ${{ secrets.NEXT_PUBLIC_STAGE_AUTOCOMPLETE_URL }}
          NEXT_PUBLIC_STAGE_API_KEY: ${{ secrets.NEXT_PUBLIC_STAGE_API_KEY }}
          NEXT_PUBLIC_DEV_OTP_URL: ${{ secrets.NEXT_PUBLIC_DEV_OTP_URL }}
          NEXT_PUBLIC_DEV_AUTOCOMPLETE_URL: ${{ secrets.NEXT_PUBLIC_DEV_AUTOCOMPLETE_URL }}
          NEXT_PUBLIC_DEV_API_KEY: ${{ secrets.NEXT_PUBLIC_DEV_API_KEY }}

      - name: Start server in background
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          BASE_URL: http://localhost:3000
          HEADLESS: 'true'

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            e2e/dist/
            npm-debug.log*
          retention-days: 7
